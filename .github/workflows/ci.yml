name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Admin dashboard
    runs-on: ubuntu-latest
    env:
      # Nilai placeholder hanya untuk build CI. Produksi memakai env Vercel.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      NEXT_PUBLIC_API_URL: https://www.admincarikostkita.my.id
      CARIKOSTKITA_API_URL: https://carikostkitafastapi.vercel.app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify legacy inline image migration
        run: npm run verify:inline-images

      - name: Build
        run: npm run build
